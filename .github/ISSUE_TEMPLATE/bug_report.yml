name: Bug report
description: Report a reproducible bug (remove secrets and real billing data)
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, cookies, database URLs, real bills, or personal data."
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / traceback
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Billing/allocation
        - Settlement
        - Auth/permissions
        - Agent
        - Frontend
        - Deployment/backup
        - Other
