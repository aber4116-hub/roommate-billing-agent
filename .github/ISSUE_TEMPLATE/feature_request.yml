name: Feature request
description: Propose a capability or UX change
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Billing/allocation
        - Settlement
        - Auth/permissions
        - Agent
        - Frontend
        - Deployment/backup
        - Other
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This does not bypass the user confirmation flow for financial writes.
        - label: This does not require putting API keys or real bills in the browser.
