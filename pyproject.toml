[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "roommate-billing-agent"
version = "0.1.0-rc.1"
description = "合租账单分摊与结算 Agent"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "roommate-billing-agent contributors" }]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.40,<2.1",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "argon2-cffi>=25,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10",
  "pytest-cov>=6,<8",
  "hypothesis>=6.150,<7",
  "httpx>=0.28,<1",
  "ruff>=0.17,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文注释/文档字符串使用全角标点，RUF001-003 的“歧义 Unicode”提示不适用。
# FastAPI 的依赖注入惯用 Depends(...) 作为默认值，B008 不适用。
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
